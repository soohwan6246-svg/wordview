<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Docx Viewer</title>
  
  <!-- Tailwind CSS & Lucide Icons CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM (Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (JSX 실행용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- mammoth.js (.docx 워드 파싱용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <!-- Google Identity Services & GAPI -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SAMPLE_BLOCKS = [
      { id: 'blk-1', type: 'h1', text: '1. iPad Pro 워드(.docx) 뷰어 완벽 활용 가이드' },
      { id: 'blk-2', type: 'p', text: '환영합니다! 이 웹 애플리케이션은 아이패드(iPadOS) Safari 환경에 맞춰 설계된 프리미엄 워드(.docx) 및 텍스트 문서 뷰어입니다. 별도의 무거운 오피스 앱을 설치하지 않고도 문서를 쾌적하게 열람할 수 있습니다.' },
      { id: 'blk-3', type: 'h2', text: '1.1 터치 친화적인 인터페이스와 파일 불러오기' },
      { id: 'blk-4', type: 'p', text: '상단 툴바의 [파일 열기] 버튼을 누르면 기기의 .docx 파일이나 .txt, .md 파일을 즉시 불러옵니다. 서버로 파일이 전송되지 않아 매우 안전합니다.' },
      { id: 'blk-5', type: 'blockquote', text: '💡 팁: 오른쪽 상단의 [구글 드라이브] 버튼을 눌러 내 드라이브의 원고와 문서들을 직접 불러올 수 있습니다.' },
      { id: 'blk-8', type: 'h1', text: '2. 모바일 리딩 최적화' },
      { id: 'blk-9', type: 'p', text: '글자 크기와 상하 스크롤 모드를 지원하여 장시간 원고 검토 시에도 눈의 피로를 최소화합니다.' }
    ];

    function App() {
      const [blocks, setBlocks] = useState(SAMPLE_BLOCKS);
      const [title, setTitle] = useState('샘플 가이드 문서');
      const [fontSize, setFontSize] = useState(18);
      const [isDriveOpen, setIsDriveOpen] = useState(false);
      const [clientId, setClientId] = useState(() => localStorage.getItem('gdrive_client_id') || '');
      const [isConnected, setIsConnected] = useState(false);
      const [driveFiles, setDriveFiles] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const tokenClientRef = useRef(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [blocks, isDriveOpen, driveFiles]);

      // 로컬 파일 업로드 처리
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setTitle(file.name);

        if (file.name.endsWith('.docx')) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const arrayBuffer = event.target.result;
            const result = await window.mammoth.convertToHtml({ arrayBuffer });
            const parser = new DOMParser();
            const doc = parser.parseFromString(result.value, 'text/html');
            const newBlocks = Array.from(doc.body.children).map((el, idx) => ({
              id: `blk-${idx}`,
              type: el.tagName.toLowerCase(),
              text: el.textContent
            }));
            setBlocks(newBlocks.length > 0 ? newBlocks : [{ id: 'blk-0', type: 'p', text: '내용이 비어 있습니다.' }]);
          };
          reader.readAsArrayBuffer(file);
        } else {
          const reader = new FileReader();
          reader.onload = (event) => {
            const lines = event.target.result.split('\n').filter(l => l.trim().length > 0);
            setBlocks(lines.map((line, idx) => ({ id: `blk-${idx}`, type: 'p', text: line })));
          };
          reader.readAsText(file);
        }
      };

      // 구글 인증 및 파일 목록 로드 (.docx 검색 조건 포함)
      const initGoogleAuth = () => {
        if (!clientId) {
          alert('OAuth 클라이언트 ID를 먼저 입력해 주세요.');
          return;
        }
        localStorage.setItem('gdrive_client_id', clientId);

        try {
          tokenClientRef.current = google.accounts.oauth2.initTokenClient({
            client_id: clientId.trim(),
            scope: 'https://www.googleapis.com/auth/drive.readonly',
            callback: async (resp) => {
              if (resp.error) {
                alert('인증 실패: ' + resp.error);
                return;
              }
              setIsConnected(true);
              fetchDriveFiles(resp.access_token);
            }
          });
          tokenClientRef.current.requestAccessToken({ prompt: 'consent' });
        } catch (err) {
          alert('구글 연동 초기화 실패: 콘솔의 승인된 자바스크립트 원본을 확인하세요.');
        }
      };

      const fetchDriveFiles = async (accessToken) => {
        setIsLoading(true);
        try {
          // docx MIME 타입 및 확장자 전체 검색 쿼리
          const query = "(mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' or " +
                        "mimeType = 'application/msword' or " +
                        "mimeType = 'application/vnd.google-apps.document' or " +
                        "name contains '.docx' or name contains '.doc' or name contains '.md' or name contains '.txt') " +
                        "and trashed = false";

          const url = `https://www.googleapis.com/drive/v3/files?pageSize=100&fields=files(id,name,mimeType,modifiedTime)&q=${encodeURIComponent(query)}&supportsAllDrives=true&includeItemsFromAllDrives=true`;
          
          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const data = await res.json();
          if (data.files) {
            setDriveFiles(data.files);
          } else {
            alert(data.error?.message || '파일을 불러오지 못했습니다.');
          }
        } catch (e) {
          alert('파일 목록 조회 중 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      const filteredFiles = driveFiles.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-stone-50">
          {/* 상단 툴바 */}
          <header className="flex items-center justify-between px-4 py-3 bg-white border-b border-stone-200 shadow-sm">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-lg text-stone-800 truncate max-w-[200px] sm:max-w-md">{title}</span>
            </div>
            
            <div className="flex items-center space-x-2">
              <div className="flex items-center bg-stone-100 rounded-lg p-1 border border-stone-200">
                <button onClick={() => setFontSize(s => Math.max(14, s - 2))} className="px-2 py-1 text-xs font-bold text-stone-600 hover:bg-white rounded">A-</button>
                <span className="px-2 text-xs text-stone-500 font-semibold">{fontSize}px</span>
                <button onClick={() => setFontSize(s => Math.min(28, s + 2))} className="px-2 py-1 text-xs font-bold text-stone-600 hover:bg-white rounded">A+</button>
              </div>

              <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition shadow-sm">
                내 기기 열기
                <input type="file" accept=".docx,.txt,.md" className="hidden" onChange={handleFileUpload} />
              </label>

              <button 
                onClick={() => setIsDriveOpen(true)}
                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition shadow-sm flex items-center space-x-1"
              >
                <span>구글 드라이브</span>
              </button>
            </div>
          </header>

          {/* 본문 열람 화면 */}
          <main className="flex-1 overflow-y-auto px-4 py-8 sm:px-12 md:px-24 custom-scrollbar">
            <div className="max-w-3xl mx-auto bg-white p-8 sm:p-14 rounded-2xl shadow-sm border border-stone-200/80 leading-relaxed text-stone-800" style={{ fontSize: `${fontSize}px` }}>
              {blocks.map((b) => {
                if (b.type === 'h1') return <h1 key={b.id} className="text-2xl font-bold mt-8 mb-4 text-stone-900 border-b pb-2">{b.text}</h1>;
                if (b.type === 'h2') return <h2 key={b.id} className="text-xl font-bold mt-6 mb-3 text-stone-800">{b.text}</h2>;
                if (b.type === 'h3') return <h3 key={b.id} className="text-lg font-semibold mt-4 mb-2 text-stone-700">{b.text}</h3>;
                if (b.type === 'blockquote') return <blockquote key={b.id} className="p-3 my-4 bg-stone-100 border-l-4 border-stone-400 italic text-stone-600 rounded-r">{b.text}</blockquote>;
                return <p key={b.id} className="my-3 leading-loose text-justify text-stone-700">{b.text}</p>;
              })}
            </div>
          </main>

          {/* 구글 드라이브 연동 모달 */}
          {isDriveOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[85vh]">
                <div className="flex items-center justify-between p-4 border-b border-stone-200">
                  <h3 className="font-bold text-stone-800">구글 드라이브 연동</h3>
                  <button onClick={() => setIsDriveOpen(false)} className="text-stone-400 hover:text-stone-600 text-lg">✕</button>
                </div>

                <div className="p-4 space-y-4 overflow-y-auto">
                  {!isConnected ? (
                    <div className="space-y-3">
                      <p className="text-xs text-stone-500 leading-relaxed">
                        구글 클라우드 콘솔에서 발급받은 <strong>클라이언트 ID</strong>를 입력하고 인증해 주세요.
                      </p>
                      <input 
                        type="text" 
                        value={clientId} 
                        onChange={(e) => setClientId(e.target.value)} 
                        placeholder="OAuth 클라이언트 ID 붙여넣기"
                        className="w-full text-xs p-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />
                      <button 
                        onClick={initGoogleAuth}
                        className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm transition"
                      >
                        구글 계정 연결하기
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-medium text-emerald-600">● 구글 드라이브 연결됨</span>
                        <button onClick={() => setIsConnected(false)} className="text-xs text-stone-400 hover:text-stone-600 underline">연결 해제</button>
                      </div>

                      <input 
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="드라이브 내 파일 검색 (.docx 포함)..."
                        className="w-full text-xs p-2.5 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
                      />

                      <div className="border border-stone-200 rounded-xl overflow-hidden divide-y divide-stone-100 max-h-60 overflow-y-auto custom-scrollbar">
                        {isLoading ? (
                          <div className="p-4 text-center text-xs text-stone-400">문서 목록 불러오는 중...</div>
                        ) : filteredFiles.length === 0 ? (
                          <div className="p-4 text-center text-xs text-stone-400">검색된 문서가 없습니다.</div>
                        ) : (
                          filteredFiles.map((f) => (
                            <div key={f.id} className="p-3 flex items-center justify-between hover:bg-stone-50 transition text-xs">
                              <span className="font-medium text-stone-700 truncate pr-2">{f.name}</span>
                              <span className="text-[10px] text-stone-400 whitespace-nowrap">{new Date(f.modifiedTime).toLocaleDateString()}</span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
